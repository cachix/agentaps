name: Linux installation

on:
  pull_request:
    paths:
      - .github/workflows/linux-install.yml
      - docs/session-terminal.md
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-deb:
    name: DEB install (clean Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENTAPS_VERSION: 0.5.2
    steps:
      - uses: actions/checkout@v5
      - name: Extract documented package prerequisites
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          guide = Path("docs/session-terminal.md").read_text()
          section = guide.split("## Linux package prerequisites\n", 1)[1]
          script = re.search(r"```sh\n(.*?)```", section, flags=re.S).group(1)
          Path(os.environ["RUNNER_TEMP"], "agentaps-prerequisites.sh").write_text(script)
          PY
          bash -n "$RUNNER_TEMP/agentaps-prerequisites.sh"
      - name: Install released DEB using the documented prerequisites
        run: |
          docker run --rm -i \
            --env AGENTAPS_VERSION \
            --env DEBIAN_FRONTEND=noninteractive \
            --volume "$RUNNER_TEMP/agentaps-prerequisites.sh:/tmp/prerequisites.sh:ro" \
            ubuntu:24.04 bash -euo pipefail <<'SH'
          # Start with a plain Ubuntu image, without runner development libraries.
          echo 'APT::Get::Assume-Yes "true";' > /etc/apt/apt.conf.d/90ci
          apt-get update
          apt-get install sudo
          bash -euo pipefail /tmp/prerequisites.sh

          cd /tmp
          package="agentaps_${AGENTAPS_VERSION}_amd64.deb"
          release="https://github.com/cachix/agentaps/releases/download/v${AGENTAPS_VERSION}"
          curl --fail --location --retry 3 "$release/$package" --output "$package"
          curl --fail --location --retry 3 "$release/$package.sha256" --output "$package.sha256"
          sha256sum --check "$package.sha256"
          sudo apt install "./$package"

          dpkg-query -W agentaps libc++1-21 libc++abi1-21 libxml2
          dependencies=$(ldd /usr/bin/agentaps)
          printf '%s\n' "$dependencies"
          [[ "$dependencies" != *"not found"* ]]
          [[ "$(agentaps --version)" == "agentaps $AGENTAPS_VERSION" ]]
          ! command -v zig
          SH
