name: Desktop build candidates

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/desktop-builds.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - src/**
      - assets/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - runner: macos-15
            target: aarch64-apple-darwin
            formats: dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            formats: nsis
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xinput-dev libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add "${{ matrix.target }}"
      - name: Check package metadata
        shell: bash
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 --locked | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "agentaps"))')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match Cargo version v$package_version" >&2
            exit 1
          fi
          echo "Agentaps $package_version"
      - name: Build desktop app
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Test Windows agent discovery
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --release --locked --target "${{ matrix.target }}" discovery::tests::finds_and_runs_batch_commands_without_an_extension
      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Package candidate
        shell: bash
        run: cargo packager --release --target "${{ matrix.target }}" --formats "${{ matrix.formats }}" --out-dir dist/desktop
      - name: Checksum packages
        shell: bash
        working-directory: dist/desktop
        run: |
          for asset in *.deb *.AppImage *.dmg *.exe; do
            [[ -f "$asset" ]] || continue
            if command -v sha256sum >/dev/null; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop/*
          if-no-files-found: error

  draft_release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true
      - name: Verify archives
        working-directory: dist/desktop
        run: sha256sum --check -- *.sha256
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/desktop/* --draft --verify-tag --generate-notes
