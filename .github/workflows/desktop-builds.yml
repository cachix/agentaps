name: Desktop build candidates

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/desktop-builds.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - src/**
      - themes/**
      - assets/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - runner: macos-15
            target: aarch64-apple-darwin
            formats: dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            formats: nsis
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xinput-dev libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev libgtk-4-dev qt6-base-dev libasound2-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add "${{ matrix.target }}"
      - name: Check package metadata
        shell: bash
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 --locked | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "agentaps"))')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match Cargo version v$package_version" >&2
            exit 1
          fi
          echo "Agentaps $package_version"
      - name: Build desktop app
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Check Linux terminal linking
        if: runner.os == 'Linux'
        shell: bash
        run: |
          libraries=$(readelf -d "target/${{ matrix.target }}/release/agentaps")
          [[ "$libraries" != *"[libxml2.so"* ]]
          [[ "$libraries" != *"[libc++.so"* ]]
      - name: Test Windows agent discovery
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --release --locked --target "${{ matrix.target }}" discovery::tests::finds_and_runs_batch_commands_without_an_extension
      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Package candidate
        shell: bash
        run: cargo packager --release --target "${{ matrix.target }}" --formats "${{ matrix.formats }}" --out-dir dist/desktop
      - name: Checksum packages
        shell: bash
        working-directory: dist/desktop
        run: |
          for asset in *.deb *.AppImage *.dmg *.exe; do
            [[ -f "$asset" ]] || continue
            if command -v sha256sum >/dev/null; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop/*
          if-no-files-found: error

  ubuntu26-build:
    name: Ubuntu 26.04 DEB build
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Install Ubuntu 26.04 build libraries
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git sudo python3 xz-utils \
            build-essential cmake pkg-config \
            libfontconfig-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev \
            libegl-dev libgles-dev libglib2.0-dev libgtk-4-dev qt6-base-dev libasound2-dev
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          curl --fail --silent --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build against Ubuntu 26.04 libraries
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          libraries=$(readelf -d target/x86_64-unknown-linux-gnu/release/agentaps)
          [[ "$libraries" != *"[libxml2.so"* ]]
          [[ "$libraries" != *"[libc++.so"* ]]
      - name: Package Ubuntu 26.04 DEB
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo packager --release --target x86_64-unknown-linux-gnu --formats deb --out-dir dist/desktop
          for package in dist/desktop/*_amd64.deb; do
            mv "$package" "${package%_amd64.deb}_ubuntu26.04_amd64.deb"
          done
          cd dist/desktop
          for package in *.deb; do
            sha256sum "$package" > "$package.sha256"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-x86_64-unknown-linux-gnu-ubuntu26.04
          path: dist/desktop/*
          if-no-files-found: error

  ubuntu26-install:
    name: DEB install (clean Ubuntu 26.04)
    needs: ubuntu26-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-x86_64-unknown-linux-gnu-ubuntu26.04
          path: dist/desktop
      - name: Install the native package without build dependencies
        run: |
          docker run --rm -i --env DEBIAN_FRONTEND=noninteractive \
            --volume "$GITHUB_WORKSPACE/dist/desktop:/packages:ro" \
            ubuntu:26.04 bash -euo pipefail <<'SH'
          apt-get update
          cd /packages
          sha256sum --check -- *.sha256
          apt-get install -y ./*_ubuntu26.04_amd64.deb
          dpkg-query -W agentaps
          libraries=$(ldd /usr/bin/agentaps)
          printf '%s\n' "$libraries"
          [[ "$libraries" != *"not found"* ]]
          [[ "$(agentaps --version)" == "agentaps $(dpkg-query -W -f='${Version}' agentaps)" ]]
          ! command -v zig
          ! command -v cargo
          SH

  ubuntu24-install:
    name: DEB install (clean Ubuntu 24.04)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-x86_64-unknown-linux-gnu
          path: dist/desktop
      - name: Install the candidate without build dependencies
        run: |
          docker run --rm -i --env DEBIAN_FRONTEND=noninteractive \
            --volume "$GITHUB_WORKSPACE/dist/desktop:/packages:ro" \
            ubuntu:24.04 bash -euo pipefail <<'SH'
          apt-get update
          cd /packages
          sha256sum --check -- *.sha256
          apt-get install -y ./*_amd64.deb
          libraries=$(ldd /usr/bin/agentaps)
          printf '%s\n' "$libraries"
          [[ "$libraries" != *"not found"* ]]
          [[ "$(agentaps --version)" == "agentaps $(dpkg-query -W -f='${Version}' agentaps)" ]]
          ! command -v zig
          ! command -v cargo
          SH

  draft_release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ubuntu24-install, ubuntu26-install]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true
      - name: Verify archives
        working-directory: dist/desktop
        run: sha256sum --check -- *.sha256
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/desktop/* --draft --verify-tag --generate-notes
