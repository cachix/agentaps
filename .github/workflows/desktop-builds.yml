name: Desktop build candidates

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/desktop-builds.yml
      - scripts/release/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - src/**
      - assets/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xinput-dev libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add "${{ matrix.target }}"
      - name: Check package metadata
        shell: bash
        run: python scripts/release/package.py --check-version
      - name: Build desktop app
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Test Windows agent discovery
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --release --locked --target "${{ matrix.target }}" discovery::tests::finds_and_runs_batch_commands_without_an_extension
      - name: Package candidate
        shell: bash
        run: python scripts/release/package.py --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop/*
          if-no-files-found: error

  draft_release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true
      - name: Verify archives
        working-directory: dist/desktop
        run: sha256sum --check -- *.sha256
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/desktop/* --draft --verify-tag --generate-notes
