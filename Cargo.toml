[package]
name = "agentaps"
version = "0.5.1"
edition = "2024"
description = "Desktop client for agents that speak the Agent Client Protocol"
license = "Apache-2.0"
repository = "https://github.com/domenkozar/agentaps"
readme = "README.md"
categories = ["gui"]

[package.metadata.packager]
product-name = "Agentaps"
identifier = "dev.agentaps.app"
category = "DeveloperTool"
authors = ["Agentaps contributors"]
homepage = "https://agentaps.dev"
long-description = "A universal desktop UI for ACP-compatible coding harnesses running locally or over SSH."
license-file = "LICENSE"
icons = ["assets/packaging/icon.png"]

[package.metadata.packager.deb]
depends = ["libgtk-4-1 (>= 4.10)", "libqt6widgets6t64 (>= 6.2) | libqt6widgets6 (>= 6.2)", "qt6-qpa-plugins"]
files = { "LICENSE" = "usr/share/doc/agentaps/copyright" }

[package.metadata.packager.macos]
signing-identity = "-"

[package.metadata.packager.nsis]
installer-icon = "assets/packaging/icon.ico"

[dependencies]
anyhow = "1"
# GPUI Kit 0.7 support is on upstream main, ahead of the published 0.5.9.
native-theme-gpui = { git = "https://github.com/tiborgats/native-theme.git", rev = "0edab06a4a56114fe6994bfbbc17c70d8e0c4572", default-features = false }
agentaps-control-protocol = { path = "crates/control-protocol" }
agent-client-protocol-schema = { version = "1.9.1", default-features = false, features = ["unstable_protocol_v2"] }
base64 = "0.22"
etcetera = "0.11"
gix = { version = "0.88", default-features = false, features = ["status", "parallel", "sha1"] }
gix-imara-diff = "0.2.3"
gpui-kit = "=0.7.0"
hex = "0.4"
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
nucleo = "0.5.0"
notify = "7"
qrcode = "0.14"
regex = "1"
secretspec = { version = "0.21", default-features = false, features = ["keyring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1.1"
url = "2"

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
tempfile = "3"

[workspace]
members = ["crates/control-protocol"]
exclude = ["web", "crates/gpui-kit-reqwest-compat"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "settings"] }
detect-desktop-environment = "=1.3.0"
futures-util = "0.3"
native-theme-gtk = "=0.1.1"
native-theme-qt = "=0.1.0"
smol = "2"
xdg = "=3.0.0"
